# Analyse and test both packages on every push.
#
# The SDK version is not written here: it is read from .fvmrc, which is the
# same file the local `fvm` uses. A pinned version in two places is a pinned
# version in neither.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; the deploy job asks for exactly what it needs.
permissions:
  contents: read

# One deployment at a time, and a newer green commit wins. Never cancel a
# deploy half-way through, which would leave the site as neither version.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Flutter version
        id: sdk
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true

      - name: Engine
        working-directory: packages/oni_engine
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      - name: App
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      # test/browser holds what cannot run on the VM: the store the web build
      # keeps every saved build in is `package:web` all the way down. Without
      # this step it is never run at all, on any platform, which is how it had
      # been. Only that directory -- the rest of the suite imports dart:io and
      # would not compile for a browser.
      - name: App, in a browser
        working-directory: app
        run: flutter test --platform chrome test/browser

      - name: The shipped docs match the ones in docs/
        run: |
          ./tool/copy_docs.sh
          git diff --exit-code app/assets/using.md app/assets/changelog.md

      - name: The generated data matches its source
        working-directory: packages/oni_engine
        run: |
          dart run tool/gen_data.dart
          git diff --exit-code lib/src/data/oni_data.g.dart

  # Publish to GitHub Pages, but only what has already passed: `needs: test`
  # means a red build never reaches the web. Pull requests build and test as
  # before and stop there — nothing but main is ever published.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Flutter version
        id: sdk
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true

      - uses: actions/configure-pages@v5
        id: site

      # A project page is served from a subdirectory, so the app has to be
      # told where it lives or every asset it asks for is a 404 and the site
      # is a blank white page with no error in it.
      #
      # Taken from the Pages configuration rather than written here, because a
      # repository can be renamed and this should not have to be remembered.
      # Empty is a red build rather than a white page.
      - name: Build the web app
        working-directory: app
        env:
          BASE: ${{ steps.site.outputs.base_path }}
        run: |
          test -n "$BASE"
          flutter build web --release \
            --base-href="${BASE%/}/" \
            --dart-define=BUILD_COMMIT="$GITHUB_SHA"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

      - id: pages
        uses: actions/deploy-pages@v4
