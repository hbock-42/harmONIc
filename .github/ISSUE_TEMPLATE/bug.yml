name: Something is wrong
description: A number that looks wrong, a button that does nothing, a build that will not solve.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The **share code** below is the useful part. With it the whole build
        opens here in one paste, and most reports are then a two-minute job
        rather than a conversation. `Share` in the pipelines menu copies it.

        It holds your build and nothing else — no name, no account, nothing
        about your machine. If you would rather not include it, delete it and
        describe the build instead.

  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: The Metal Refinery said 0.03 × when I pinned the ore to 200 g/s.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: build
    attributes:
      label: The build it happened on
      description: A share code, or a description if you would rather not send one.
      render: text

  - type: input
    id: version
    attributes:
      label: Version
      description: The seven characters at the foot of the guide. Filled in for you if you came from the app.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Where you were running it
      placeholder: Chrome on Windows, or the Mac app
