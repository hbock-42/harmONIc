name: Something is wrong
description: A number that looks wrong, a button that does nothing, a build that will not solve.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Coming from the app?** Use **Report a bug** at the foot of the guide
        instead of this page — it fills in your build, the version and what you
        are running it on, and the build is most of the work of a fix.

        The share code holds your build and nothing else: no name, no account,
        nothing about your machine. It goes in the form where you can see it,
        so delete it if you would rather describe the build in words.

  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: The Metal Refinery said 0.03 × when I pinned the ore to 200 g/s.
    validations:
      required: true

  - type: textarea
    id: build
    attributes:
      label: The build it happened on
      description: >-
        Already filled in if you came from Report a bug in the app. Otherwise
        paste a share code here — Share in the pipelines menu copies one — or
        describe the build in words if you would rather not send it.

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        The seven characters beside Report a bug at the foot of the guide.
        Filled in for you if you came from there.

  - type: input
    id: platform
    attributes:
      label: Where you were running it
      placeholder: Chrome on Windows, or the Mac app
