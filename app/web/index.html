<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plan Oxygen Not Included production chains: pin one amount and everything else follows.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="harmONIc">
  <!-- The maskable one: iOS rounds the corners itself, so handing it an icon
       that is already rounded rounds it twice. -->
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon. The SVG first, which is what a browser prefers and what stays
       sharp on a retina tab; the PNG is the fallback and is drawn bolder,
       because at 16 px only about four shapes survive. -->
  <link rel="icon" type="image/svg+xml" href="icon-small.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <!-- The colour the browser paints round the page before Flutter starts, so
       the first frame is not a white flash on a dark app. -->
  <meta name="theme-color" content="#0E1116">

  <title>harmONIc</title>
  <link rel="manifest" href="manifest.json">

  <!--
    How many people came. GoatCounter counts the page, not the person: no
    cookies, no identifier, nothing about your build — which is why there is
    no consent banner in front of any of this.

    It is also the only request this app makes to anywhere. Everything else,
    including your builds, stays in the browser. Said out loud in the README
    and in the guide, because an app whose argument is that it does not hide
    things should not hide this either. Local runs are not counted; the script
    ignores localhost.
  -->
  <script data-goatcounter="https://bigpha.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
