# Nothing is skipped here any more.
#
# The rendered-pixel checks in test/render_check_test.dart used to be, behind
# a `golden` tag, and they took their assertions down with them: whether a
# badge is present, whether anything overflowed, whether a row appeared. Those
# are about layout and wording, they mean the same on every machine, and twice
# one of them was wrong for several commits because nothing ran it.
#
# So they run with everything else, and only the comparison of pixels waits to
# be asked for -- a golden being a photograph of one computer's font rendering,
# which a build server does differently:
#
#   fvm flutter test --dart-define=draw=true --update-goldens \
#     test/render_check_test.dart
#
# then look at what lands in test/goldens.
